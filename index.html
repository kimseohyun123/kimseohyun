<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#272038">
  <title>스르륵 | 스마트폰 사용 습관</title>

  <style>
    :root {
      color-scheme: light;
      --ink: #251e36;
      --purple: #6541c2;
      --panel: #272038;
      --panel-light: #403650;
      --pink: #ffc5df;
      --line: #ded9e8;
    }

    * { box-sizing: border-box; }
    [hidden] { display: none !important; }

    body {
      margin: 0;
      color: var(--ink);
      background: #30293e;
      font: 16px/1.5 system-ui, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      word-break: keep-all;
    }

    button, select, input { font: inherit; }
    button, select, summary { cursor: pointer; }
    button:focus-visible, select:focus-visible, input:focus-visible,
    summary:focus-visible, a:focus-visible {
      outline: 3px solid #ffab39;
      outline-offset: 3px;
    }

    button {
      min-height: 44px;
      padding: 10px 15px;
      border: 0;
      border-radius: 12px;
      background: var(--purple);
      color: white;
      font-weight: 700;
    }

    button:disabled { opacity: .55; cursor: default; }
    h1, h2, h3, p { margin: 0; }
    h1 { font-size: 28px; }
    h2 { font-size: 22px; }
    h3 { font-size: 17px; }

    .phone {
      width: min(100%, 450px);
      min-height: 100dvh;
      margin: auto;
      background: #faf9fc;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 15px 20px;
      background: white;
      border-bottom: 1px solid var(--line);
    }

    header strong { font-size: 23px; letter-spacing: -1px; }
    .quiet { background: #eeeaf6; color: #42325c; }
    .page { padding: 24px 20px; }
    .page > * + * { margin-top: 18px; }
    .hint { color: #574e64; font-size: 15px; }

    .card {
      display: block;
      width: 100%;
      padding: 20px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: white;
      text-align: left;
      color: var(--ink);
    }

    .card strong, .card small { display: block; }
    .card strong { font-size: 20px; }
    .card small { margin-top: 3px; color: #62576e; }
    .card + .card { margin-top: 10px; }

    .setting {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-top: 14px;
      font-weight: 700;
    }

    select {
      max-width: 100%;
      min-height: 44px;
      padding: 7px 10px;
      border: 1px solid #b1a7be;
      border-radius: 10px;
      background: white;
      color: var(--ink);
    }

    .stage {
      position: relative;
      overflow: hidden;
      background: white;
      isolation: isolate;
    }

    .content {
      padding-bottom: 10px;
      transition: filter 180ms linear;
    }

    .hero {
      min-height: 170px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #82d9ff, #ac91ff 55%, #ff99ac);
      font-size: clamp(48px, 12vw, 72px);
    }

    .hero.game {
      background: linear-gradient(140deg, #a6e6a1, #ffdc6c 65%, #ffa07a);
    }

    .caption { padding: 13px 18px 6px; }
    .caption p { font-size: 14px; color: #62576e; }
    .feed { padding: 0 18px; }
    .feed-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 7px 0;
      border-top: 1px solid #eee;
    }

    .thumb {
      display: grid;
      place-items: center;
      width: 60px;
      height: 40px;
      border-radius: 9px;
      font-size: 25px;
    }

    .badge {
      position: absolute;
      top: 10px;
      left: 10px;
      padding: 4px 10px;
      border-radius: 20px;
      background: #282036;
      color: white;
      font-size: 13px;
      font-weight: 700;
    }

    .warning {
      position: absolute;
      left: 50%;
      top: 46%;
      transform: translate(-50%, -50%);
      width: max-content;
      max-width: 88%;
      padding: 15px 20px;
      border-radius: 16px;
      background: #fff;
      box-shadow: 0 5px 24px #21172b45;
      text-align: center;
    }

    .panel {
      background: var(--panel);
      color: white;
      padding: 15px 18px 22px;
    }

    summary { padding: 6px 0; font-weight: 700; }
    .panel label { display: block; margin-top: 13px; font-weight: 700; }
    .panel input[type="range"] {
      width: 100%;
      min-height: 28px;
      margin: 2px 0;
      accent-color: #d7b2ff;
    }

    .panel p { color: #e5dfeb; font-size: 14px; }
    .panel .row {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin: 10px 0;
    }

    .panel button { background: var(--panel-light); }
    .panel .demo { color: #382138; background: var(--pink); }
    .panel details + details {
      border-top: 1px solid #544963;
      margin-top: 14px;
      padding-top: 8px;
    }

    .panel a { color: #f2ceff; }
    .panel select { margin: 4px 0 8px; }
    #cameraPreview {
      display: block;
      width: 110px;
      aspect-ratio: 4 / 3;
      margin: 8px 0;
      object-fit: cover;
      border-radius: 9px;
      transform: scaleX(-1);
    }

    @media (min-width: 600px) {
      .phone {
        margin: 20px auto;
        border-radius: 25px;
        overflow: hidden;
        min-height: min(820px, 94dvh);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .content { transition: none; }
    }
  </style>
</head>

<body>
<main class="phone">
  <header>
    <strong>스르륵</strong>
    <button id="homeButton" class="quiet" hidden>첫 화면</button>
  </header>

  <section id="home" class="page">
    <h1>누가 사용하나요?</h1>
    <button id="childButton" class="card">
      <strong>아이 모드</strong>
      <small>영상 보기 · 게임 열기</small>
    </button>
    <button id="parentButton" class="card">
      <strong>부모 모드</strong>
      <small>앱별 흑백 전환 시간 설정</small>
    </button>
  </section>

  <section id="parent" class="page" hidden>
    <h2>앱별 사용 시간</h2>
    <p class="hint">
      설정한 시간의 절반부터 색이 서서히 빠지고,
      설정 시간에 도달하면 완전히 흑백이 돼요.
    </p>
    <label class="setting">영상 앱 <select id="videoLimit"></select></label>
    <label class="setting">게임 앱 <select id="gameLimit"></select></label>
    <button id="saveButton">저장하고 아이 모드로</button>
  </section>

  <section id="child" class="page" hidden>
    <h2>무엇을 열어 볼까?</h2>
    <button id="openVideo" class="card">
      <strong>🎬 영상 보기</strong>
      <small id="videoInfo"></small>
    </button>
    <button id="openGame" class="card">
      <strong>🎮 게임 열기</strong>
      <small id="gameInfo"></small>
    </button>
  </section>

  <section id="viewer" hidden>
    <div class="stage">
      <!-- 콘텐츠에만 필터를 적용해 거리 안내는 또렷하게 보입니다. -->
      <div id="content" class="content">
        <div id="hero" class="hero"></div>
        <div class="caption">
          <h2 id="contentTitle"></h2>
          <p id="contentDescription"></p>
        </div>
        <div id="feed" class="feed"></div>
      </div>

      <div id="badge" class="badge">스르륵 작동 중</div>

      <div id="warning" class="warning" role="status" hidden>
        <strong>👀 화면을 조금 멀리해 볼까?</strong>
        <p id="warningDistance"></p>
      </div>
    </div>

    <div class="panel">
      <details open>
        <summary>시연 조작</summary>

        <label for="timeSlider">
          연속 시청 시간 · <span id="timeText">0분</span>
        </label>
        <input id="timeSlider" type="range" min="0" max="30" step="0.1" value="0">
        <p id="colorStatus"></p>

        <div class="row">
          <button id="demoButton" class="demo">10초 압축 시연</button>
          <button id="resetTime">시간 초기화</button>
        </div>

        <label for="distanceSlider">
          화면과 눈 사이 거리 · <span id="distanceText">40cm</span>
        </label>
        <input id="distanceSlider" type="range" min="10" max="60" value="40">
        <p id="distanceStatus"></p>

        <div class="row">
          <button id="cameraButton">전면 카메라 켜기</button>
          <button id="calibrateButton" disabled>지금 30cm로 보정</button>
        </div>
        <video id="cameraPreview" playsinline muted hidden></video>
        <p id="cameraStatus" role="status">슬라이더로 거리를 조절할 수 있어요.</p>
      </details>

      <details>
        <summary>적용 기준과 이전 프로토타입</summary>
        <label for="profile">시연 기준 선택</label>
        <select id="profile">
          <option value="classroom">수업 발표안 · 부모 설정 적용</option>
          <option value="recent">이번 프로토타입 기준</option>
          <option value="previous">이전 프로토타입 기준</option>
        </select>
        <p id="profileDescription"></p>
        <p style="margin-top:10px">
          <a href="https://resplendent-paletas-99b406.netlify.app/"
             target="_blank" rel="noopener">이번 프로토타입 열기</a>
          ·
          <a href="https://dynamic-lollipop-f72930.netlify.app/"
             target="_blank" rel="noopener">이전 프로토타입 열기</a>
        </p>
      </details>

      <div class="row">
        <button id="backButton">아이 홈으로</button>
      </div>
    </div>
  </section>
</main>

<script type="module">
  const $ = id => document.getElementById(id);
  const clamp = (value, min, max) => Math.max(min, Math.min(max, value));
  const pages = ["home", "parent", "child", "viewer"];
  const allowedLimits = [10, 20, 30, 40, 60];
  const settingsKey = "seureureuk-app-limits-v1";

  const apps = {
    video: {
      hero: "🐰 🐻 🐥",
      title: "곰돌이와 친구들의 신나는 모험",
      description: "동요와 만화 · 영상 앱 예시 화면",
      items: [
        ["🚒", "#ffd2c9", "출동! 소방차 노래"],
        ["🦖", "#b9e5b4", "공룡 친구들 이야기"],
        ["🚀", "#cfc5ff", "우주 여행을 떠나요"]
      ]
    },
    game: {
      hero: "🌳 🦊 🌻",
      title: "숲속 여우의 보물찾기",
      description: "모험 지도 · 게임 앱 예시 화면",
      items: [
        ["🍄", "#ffd3bc", "버섯 마을"],
        ["💎", "#a9e6ef", "반짝이는 동굴"],
        ["🏰", "#efc6ff", "구름 위의 성"]
      ]
    }
  };

  // 부모 설정은 현재 브라우저에 저장됩니다.
  let limits = { video: 30, game: 30 };

  try {
    const saved = JSON.parse(localStorage.getItem(settingsKey) || "{}");
    for (const key of Object.keys(limits)) {
      if (saved && allowedLimits.includes(saved[key])) {
        limits[key] = saved[key];
      }
    }
  } catch {
    // 브라우저 저장소를 사용할 수 없으면 기본값으로 시작합니다.
  }

  for (const select of [$("videoLimit"), $("gameLimit")]) {
    for (const minutes of allowedLimits) {
      select.add(new Option(`${minutes}분`, String(minutes)));
    }
  }

  let activePage = "home";
  let activeApp = "video";
  let distanceCm = 40;
  let minutes = 0;
  let lastTick = performance.now();
  let demoStart = null;

  function rules() {
    if ($("profile").value === "recent") {
      return { start: 30, full: 50, blur: 20, warn: 10 };
    }
    if ($("profile").value === "previous") {
      return { start: 60, full: 80, blur: 30, warn: 20 };
    }
    const full = limits[activeApp];
    return { start: full / 2, full, blur: 30, warn: 20 };
  }

  function formatTime(value) {
    const seconds = Math.floor(value * 60);
    const min = Math.floor(seconds / 60);
    const sec = seconds % 60;
    return sec ? `${min}분 ${sec}초` : `${min}분`;
  }

  function render() {
    const r = rules();

    // 흑백은 시청 시간, 블러는 거리를 기준으로 각각 계산합니다.
    const gray = clamp((minutes - r.start) / (r.full - r.start), 0, 1);
    const blur = 14 * clamp((r.blur - distanceCm) / (r.blur - 10), 0, 1);

    $("content").style.filter =
      `grayscale(${gray.toFixed(4)}) blur(${blur.toFixed(2)}px)`;

    $("timeSlider").max = r.full;
    $("timeSlider").value = minutes;
    $("timeText").textContent = formatTime(minutes);
    $("distanceSlider").value = Math.round(distanceCm);
    $("distanceText").textContent = `${Math.round(distanceCm)}cm`;

    if (gray === 0) {
      $("colorStatus").textContent = `원래 색을 유지하고 있어요. ${r.start}분부터 색이 옅어져요.`;
    } else if (gray < 1) {
      $("colorStatus").textContent = `색이 서서히 옅어지고 있어요. 남은 채도 ${Math.round((1 - gray) * 100)}%`;
    } else {
      $("colorStatus").textContent = `${r.full}분에 도달해 완전 흑백이 되었어요.`;
    }

    $("distanceStatus").textContent = blur > 0
      ? `가까워질수록 흐려져요. 현재 블러 강도 ${blur.toFixed(1)}px`
      : `현재 화면이 선명해요. ${r.blur}cm 미만부터 흐려져요.`;

    $("warning").hidden = distanceCm > r.warn;
    $("warningDistance").textContent = `현재 약 ${Math.round(distanceCm)}cm`;
    $("badge").textContent =
      `스르륵 · ${blur > 0 ? "거리 블러" : "선명함"} · ${
        gray === 1 ? "완전 흑백" : gray > 0 ? "흑백 전환 중" : "컬러"
      }`;

    $("profileDescription").textContent =
      `${r.blur}cm 미만부터 블러, ${r.warn}cm 이하에서 거리 안내. ` +
      `${r.start}분부터 채도가 감소하고 ${r.full}분에 완전 흑백이 돼요.`;
  }

  function stopDemo() {
    demoStart = null;
    lastTick = performance.now();
    $("demoButton").textContent = "10초 압축 시연";
  }

  // 실제 시청 시간은 콘텐츠 화면이 열린 동안만 증가합니다.
  // 압축 시연을 누르면 같은 변화를 10초 동안 재현합니다.
  setInterval(() => {
    const now = performance.now();
    const elapsed = now - lastTick;
    lastTick = now;

    if (activePage !== "viewer" || document.hidden) return;
    const { full } = rules();

    if (demoStart !== null) {
      const progress = clamp((now - demoStart) / 10000, 0, 1);
      minutes = progress * full;
      if (progress >= 1) stopDemo();
    } else {
      if (minutes >= full) return;
      minutes = Math.min(full, minutes + elapsed / 60000);
    }
    render();
  }, 150);

  function showPage(id) {
    if (activePage === "viewer" && id !== "viewer") {
      stopDemo();
      stopCamera();
    }
    activePage = id;
    for (const page of pages) $(page).hidden = page !== id;
    $("homeButton").hidden = id === "home";
    window.scrollTo(0, 0);
  }

  function openChild() {
    $("videoInfo").textContent = `${limits.video}분에 완전 흑백`;
    $("gameInfo").textContent = `${limits.game}분에 완전 흑백`;
    showPage("child");
  }

  function openApp(key) {
    activeApp = key;
    const app = apps[key];

    $("hero").textContent = app.hero;
    $("hero").classList.toggle("game", key === "game");
    $("contentTitle").textContent = app.title;
    $("contentDescription").textContent = app.description;
    $("feed").replaceChildren();

    for (const [emoji, color, title] of app.items) {
      const row = document.createElement("div");
      row.className = "feed-item";

      const thumb = document.createElement("span");
      thumb.className = "thumb";
      thumb.style.background = color;
      thumb.textContent = emoji;

      const text = document.createElement("strong");
      text.textContent = title;
      row.append(thumb, text);
      $("feed").append(row);
    }

    minutes = 0;
    distanceCm = 40;
    $("profile").value = "classroom";
    $("cameraStatus").textContent = "슬라이더로 거리를 조절할 수 있어요.";
    stopDemo();
    showPage("viewer");
    render();
  }

  $("homeButton").onclick = () => showPage("home");
  $("childButton").onclick = openChild;
  $("backButton").onclick = openChild;
  $("openVideo").onclick = () => openApp("video");
  $("openGame").onclick = () => openApp("game");

  $("parentButton").onclick = () => {
    $("videoLimit").value = limits.video;
    $("gameLimit").value = limits.game;
    showPage("parent");
  };

  $("saveButton").onclick = () => {
    limits.video = Number($("videoLimit").value);
    limits.game = Number($("gameLimit").value);
    try {
      localStorage.setItem(settingsKey, JSON.stringify(limits));
    } catch {
      // 저장소가 차단된 환경에서도 현재 시연에는 설정을 적용합니다.
    }
    openChild();
  };

  $("profile").onchange = () => {
    stopDemo();
    minutes = 0;
    render();
  };

  $("demoButton").onclick = () => {
    minutes = 0;
    lastTick = performance.now();
    demoStart = lastTick;
    $("demoButton").textContent = "처음부터 다시 시연";
    render();
  };

  $("resetTime").onclick = () => {
    stopDemo();
    minutes = 0;
    render();
  };

  $("timeSlider").oninput = event => {
    stopDemo();
    minutes = Number(event.target.value);
    render();
  };

  $("distanceSlider").oninput = event => {
    distanceCm = Number(event.target.value);
    render();
  };

  // 카메라에서 두 홍채 중심 사이의 간격을 측정합니다.
  // 30cm에서 측정한 간격을 기준으로 이후 거리를 추정합니다.
  const preview = $("cameraPreview");
  const visionURL =
    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";
  const modelURL =
    "https://storage.googleapis.com/mediapipe-models/face_landmarker/" +
    "face_landmarker/float16/1/face_landmarker.task";

  let stream = null;
  let modelPromise = null;
  let cameraTimer = null;
  let cameraSession = 0;
  let cameraStarting = false;
  let latestEyeGap = 0;
  let lastFaceAt = 0;
  let referenceGap = 0;
  let smoothedDistance = null;

  async function getModel() {
    if (!modelPromise) {
      modelPromise = (async () => {
        const vision = await import(`${visionURL}/+esm`);
        const files = await vision.FilesetResolver.forVisionTasks(
          `${visionURL}/wasm`
        );
        return vision.FaceLandmarker.createFromOptions(files, {
          baseOptions: { modelAssetPath: modelURL },
          runningMode: "VIDEO",
          numFaces: 1
        });
      })().catch(error => {
        modelPromise = null;
        throw error;
      });
    }
    return modelPromise;
  }

  function stopCamera(message = "슬라이더로 거리를 조절할 수 있어요.") {
    cameraSession++;
    cameraStarting = false;
    clearInterval(cameraTimer);
    cameraTimer = null;

    if (stream) {
      for (const track of stream.getTracks()) track.stop();
    }
    stream = null;
    preview.srcObject = null;
    preview.hidden = true;

    latestEyeGap = 0;
    lastFaceAt = 0;
    referenceGap = 0;
    smoothedDistance = null;
    $("distanceSlider").disabled = false;
    $("calibrateButton").disabled = true;
    $("cameraButton").textContent = "전면 카메라 켜기";
    $("cameraStatus").textContent = message;
  }

  async function startCamera() {
    if (!window.isSecureContext || !navigator.mediaDevices?.getUserMedia) {
      $("cameraStatus").textContent =
        "카메라는 HTTPS 주소에서 사용할 수 있어요. 거리 슬라이더로도 시연할 수 있어요.";
      return;
    }

    const session = ++cameraSession;
    cameraStarting = true;
    $("cameraButton").textContent = "카메라 취소";
    $("cameraStatus").textContent = "전면 카메라 사용을 허용해 주세요.";

    try {
      const newStream = await navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: "user",
          width: { ideal: 640 },
          height: { ideal: 480 }
        },
        audio: false
      });

      if (session !== cameraSession) {
        newStream.getTracks().forEach(track => track.stop());
        return;
      }

      stream = newStream;
      preview.srcObject = stream;
      preview.hidden = false;
      await preview.play();
      if (session !== cameraSession) return;

      $("cameraStatus").textContent = "얼굴 인식 모델을 불러오는 중이에요.";
      const model = await getModel();
      if (session !== cameraSession) return;

      cameraStarting = false;
      $("cameraButton").textContent = "카메라 끄기";
      $("distanceSlider").disabled = true;
      let lastVideoTime = -1;

      cameraTimer = setInterval(() => {
        if (preview.readyState < 2 || preview.currentTime === lastVideoTime) return;
        lastVideoTime = preview.currentTime;

        let face;
        try {
          const result = model.detectForVideo(preview, performance.now());
          face = result.faceLandmarks?.[0];
        } catch {
          stopCamera("거리 추정을 중단했어요. 슬라이더로 계속 시연할 수 있어요.");
          return;
        }

        if (!face?.[468] || !face?.[473]) {
          latestEyeGap = 0;
          $("calibrateButton").disabled = true;
          $("cameraStatus").textContent =
            "얼굴을 찾는 중이에요. 마지막 거리에서 갱신을 잠시 멈췄어요.";
          return;
        }

        const left = face[468];
        const right = face[473];
        latestEyeGap = Math.hypot(
          (left.x - right.x) * preview.videoWidth,
          (left.y - right.y) * preview.videoHeight
        );

        if (latestEyeGap < 1) {
          $("calibrateButton").disabled = true;
          return;
        }

        lastFaceAt = performance.now();
        $("calibrateButton").disabled = false;

        if (!referenceGap) {
          $("cameraStatus").textContent =
            "얼굴이 보여요. 화면에서 약 30cm 떨어진 뒤 ‘지금 30cm로 보정’을 눌러 주세요.";
          return;
        }

        const estimate = 30 * referenceGap / latestEyeGap;
        smoothedDistance = smoothedDistance === null
          ? estimate
          : smoothedDistance * 0.7 + estimate * 0.3;

        distanceCm = clamp(smoothedDistance, 10, 60);
        $("cameraStatus").textContent =
          `카메라 추정 거리 약 ${Math.round(smoothedDistance)}cm · 정면을 바라봐 주세요.`;
        render();
      }, 140);
    } catch (error) {
      if (session !== cameraSession) return;
      const message = error.name === "NotAllowedError"
        ? "카메라 권한이 꺼져 있어요."
        : "카메라 또는 얼굴 인식 모델을 열 수 없어요.";
      stopCamera(`${message} 거리 슬라이더로 계속 시연할 수 있어요.`);
    }
  }

  $("cameraButton").onclick = () => {
    if (stream || cameraStarting) stopCamera();
    else startCamera();
  };

  $("calibrateButton").onclick = () => {
    if (!stream || latestEyeGap < 1 || performance.now() - lastFaceAt > 750) {
      $("cameraStatus").textContent = "얼굴을 정면에 맞추고 다시 눌러 주세요.";
      return;
    }
    referenceGap = latestEyeGap;
    smoothedDistance = 30;
    distanceCm = 30;
    $("cameraStatus").textContent = "30cm 보정 완료. 앞뒤로 천천히 움직여 보세요.";
    render();
  };

  document.addEventListener("visibilitychange", () => {
    lastTick = performance.now();
    if (document.hidden) {
      stopDemo();
      if (stream || cameraStarting) stopCamera();
    }
  });

  window.addEventListener("pagehide", () => stopCamera());
</script>
</body>
</html>
